[project]
name = "genetic-xgb"
version = "0.1.0"
description = "Genetic-algorithm hyperparameter optimization for XGBoost classifiers and regressors"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "joblib>=1.3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.0",
    "mypy>=2.1.0",
    "nbconvert>=7.17.1",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genetic_xgb"]

[tool.pytest.ini_options]
addopts = "--cov=genetic_xgb --cov-report=term-missing --cov-report=html --cov-branch --cov-fail-under=100"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["genetic_xgb"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "C4", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["xgboost.*", "sklearn.*", "joblib.*", "scipy.*", "pandas.*"]
ignore_missing_imports = true
