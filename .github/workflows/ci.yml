name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly canary (Mondays 04:17 UTC): re-audits pinned deps against newly
    # disclosed advisories and catches ecosystem bitrot even with no new commits.
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Least privilege by default; jobs opt into more only where needed.
permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Sync dependencies (locked)
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Sync dependencies (locked)
        run: uv sync --locked
      - name: Mypy (strict)
        run: uv run mypy

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Sync dependencies (locked)
        run: uv sync --locked
      - name: Tests (100% branch-coverage gate)
        run: uv run pytest -p no:cacheprovider

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Export locked dependencies
        run: >-
          uv export --locked --format requirements-txt
          --no-emit-project --all-groups -o requirements.audit.txt
      - name: pip-audit (lockfile)
        run: uvx pip-audit -r requirements.audit.txt

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    # Compares the PR's dependency delta against advisories; only meaningful on PRs.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # Single aggregate gate for branch protection. Requiring THIS one check keeps
  # the ruleset stable as jobs are renamed or added below: every job above must
  # succeed (or, for PR-only jobs on non-PR events, be skipped) for this to pass.
  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs: [lint, typecheck, test, audit, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "typecheck=${{ needs.typecheck.result }}"
          echo "test=${{ needs.test.result }}"
          echo "audit=${{ needs.audit.result }}"
          echo "dependency-review=${{ needs.dependency-review.result }}"
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "::error::One or more required jobs did not pass."
            exit 1
          fi
          echo "All required jobs passed."
